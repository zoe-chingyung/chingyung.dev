name: CI

on:
  pull_request:
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Lighthouse CI (score >= 90 gate)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ""

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7
