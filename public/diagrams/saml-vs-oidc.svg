<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="ui-monospace, monospace">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="#5b6470"/></marker>
    <style>.bx{fill:#5b6470;fill-opacity:0.08;stroke:#5b6470;stroke-width:1.3}.bt{fill:#0f766e;fill-opacity:0.10;stroke:#0f766e;stroke-width:1.4}.h{font-size:13px;font-weight:700}.s{font-size:10.5px;fill:#5b6470}.l{stroke:#5b6470;stroke-width:1.2;fill:none}.tt{fill:#0f766e}.tg{fill:#5b6470}</style>
  </defs>
  <text class="h tg" x="20" y="26">SAML 2.0  ·  XML assertion  ·  browser redirect</text>
  <rect class="bx" x="20" y="40" width="120" height="44" rx="6"/><text class="s" x="80" y="66" text-anchor="middle">Browser / SP</text>
  <rect class="bx" x="320" y="40" width="120" height="44" rx="6"/><text class="s" x="380" y="66" text-anchor="middle">IdP</text>
  <line class="l" x1="140" y1="56" x2="316" y2="56" marker-end="url(#a1)"/><text class="s" x="228" y="50" text-anchor="middle">redirect + XML</text>
  <line class="l" x1="316" y1="74" x2="140" y2="74" marker-end="url(#a1)"/><text class="s" x="228" y="98" text-anchor="middle">signed XML assertion (verbose)</text>
  <text class="s" x="470" y="60">Heavy XML, form-POST through</text>
  <text class="s" x="470" y="76">the browser — awkward for SPAs,</text>
  <text class="s" x="470" y="92">mobile and machine-to-machine.</text>

  <line x1="20" y1="130" x2="740" y2="130" stroke="#5b6470" stroke-dasharray="3 4" stroke-opacity="0.4"/>

  <text class="h tt" x="20" y="170">OIDC  ·  JSON Web Token (JWT)  ·  API-native (on OAuth 2.0)</text>
  <rect class="bt" x="20" y="186" width="120" height="44" rx="6"/><text class="s" x="80" y="212" text-anchor="middle">Client / App</text>
  <rect class="bt" x="320" y="186" width="120" height="44" rx="6"/><text class="s" x="380" y="212" text-anchor="middle">IdP / Auth server</text>
  <line class="l" x1="140" y1="202" x2="316" y2="202" marker-end="url(#a1)" stroke="#0f766e"/><text class="s" x="228" y="196" text-anchor="middle">token request</text>
  <line class="l" x1="316" y1="220" x2="140" y2="220" marker-end="url(#a1)" stroke="#0f766e"/><text class="s" x="228" y="244" text-anchor="middle">compact signed JWT (header.payload.sig)</text>
  <text class="s" x="470" y="206">Small, base64url JSON. Easy to parse,</text>
  <text class="s" x="470" y="222">carry in an Authorization header, and</text>
  <text class="s" x="470" y="238">verify with the IdP's public keys — ideal</text>
  <text class="s" x="470" y="254">for APIs, microservices, SPAs and CI.</text>
</svg>
