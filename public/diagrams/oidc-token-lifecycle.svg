<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="ui-monospace, monospace">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="#0f766e"/></marker>
    <style>.col{fill:#0f766e;fill-opacity:0.10;stroke:#0f766e;stroke-width:1.4}.h{font-size:12px;font-weight:700;fill:#0f766e}.s{font-size:10.5px;fill:#5b6470}.l{stroke:#0f766e;stroke-width:1.3;fill:none}.n{font-size:10px;fill:#0f766e}</style>
  </defs>
  <rect class="col" x="20"  y="30" width="150" height="40" rx="6"/><text class="h" x="95"  y="55" text-anchor="middle">GitHub Actions</text>
  <rect class="col" x="305" y="30" width="150" height="40" rx="6"/><text class="h" x="380" y="55" text-anchor="middle">AWS STS</text>
  <rect class="col" x="590" y="30" width="150" height="40" rx="6"/><text class="h" x="665" y="55" text-anchor="middle">IAM role + trust</text>

  <line class="l" x1="95" y1="70" x2="95" y2="320" stroke-dasharray="2 4" stroke-opacity="0.4"/>
  <line class="l" x1="380" y1="70" x2="380" y2="320" stroke-dasharray="2 4" stroke-opacity="0.4"/>
  <line class="l" x1="665" y1="70" x2="665" y2="320" stroke-dasharray="2 4" stroke-opacity="0.4"/>

  <text class="n" x="95" y="100" text-anchor="middle">① mint OIDC JWT (~5 min)</text>
  <text class="s" x="95" y="115" text-anchor="middle">claims: sub, repo, ref, environment</text>

  <line class="l" x1="95" y1="135" x2="376" y2="135" marker-end="url(#a2)"/>
  <text class="s" x="235" y="129" text-anchor="middle">② AssumeRoleWithWebIdentity(JWT)</text>

  <line class="l" x1="380" y1="160" x2="661" y2="160" marker-end="url(#a2)"/>
  <text class="s" x="520" y="154" text-anchor="middle">③ validate signature + check sub/aud</text>

  <line class="l" x1="661" y1="185" x2="384" y2="185" marker-end="url(#a2)"/>
  <text class="s" x="520" y="205" text-anchor="middle">④ claims match trust policy → allow</text>

  <line class="l" x1="376" y1="230" x2="99" y2="230" marker-end="url(#a2)"/>
  <text class="s" x="235" y="224" text-anchor="middle">⑤ temporary credentials</text>
  <text class="n" x="235" y="247" text-anchor="middle">default 1 h (900 s – 12 h)</text>

  <rect x="20" y="280" width="720" height="42" rx="6" fill="#0f766e" fill-opacity="0.06" stroke="#0f766e" stroke-width="1.1"/>
  <text class="s" x="380" y="298" text-anchor="middle">⑥ job ends → credentials expire on their own. Nothing to rotate, nothing stored.</text>
  <text class="s" x="380" y="314" text-anchor="middle">Mismatched repo / branch / environment in the JWT → step ④ denies before any access.</text>
</svg>
